<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Knead yeast dough</title><desc id="desc">Stretch with heel of hand. Fold the dough back over itself. Turn and repeat until elastic. For yeast dough only. Use the recipe’s work surface and time; do not apply to scones or soda bread.</desc><g transform="translate(0,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#f3f6eb"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M49 105 Q25 58 92 55 Q164 49 174 102 Z" fill="#e5b666" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M60 42 l92 0" fill="none" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M145 36 l7 6 l-7 6" fill="none" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Stretch with heel of hand</tspan></text></g><g transform="translate(240,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#eef4ed"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M49 105 Q25 58 92 55 Q164 49 174 102 Z" fill="#e5b666" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M91 61 Q158 66 112 95 Q76 88 91 61 Z" fill="#eed09a" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Fold the dough back over</tspan><tspan x="120" dy="19">itself</tspan></text></g><g transform="translate(480,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#fbf1e3"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M49 105 Q25 58 92 55 Q164 49 174 102 Z" fill="#e5b666" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M91 61 Q158 66 112 95 Q76 88 91 61 Z" fill="#eed09a" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M61 39 l70 0" fill="none" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M124 33 l7 6 l-7 6" fill="none" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Turn and repeat until</tspan><tspan x="120" dy="19">elastic</tspan></text></g></svg>
