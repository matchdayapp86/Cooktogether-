<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Brown meat in batches</title><desc id="desc">Place pieces in a single layer. Let underside colour; turn. Remove only when recipe says. Use tongs and uncrowded batches. A browned surface does not mean the centre is cooked.</desc><g transform="translate(0,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#f3f6eb"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><g transform="translate(8,25)"><rect x="31" y="70" width="143" height="47" rx="10" fill="#e0e9e4" stroke="#285346" stroke-width="2"/><path d="M174 82 h29" fill="none" stroke="#285346" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><rect x="47" y="91" width="22" height="18" rx="4" fill="#b58259" stroke="#285346" stroke-width="2"/><rect x="85" y="88" width="22" height="18" rx="4" fill="#b58259" stroke="#285346" stroke-width="2"/><rect x="126" y="85" width="22" height="18" rx="4" fill="#b58259" stroke="#285346" stroke-width="2"/></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Place pieces in a single</tspan><tspan x="120" dy="19">layer</tspan></text></g><g transform="translate(240,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#eef4ed"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><rect x="31" y="70" width="143" height="47" rx="10" fill="#e0e9e4" stroke="#285346" stroke-width="2"/><path d="M174 82 h29" fill="none" stroke="#285346" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><rect x="47" y="91" width="22" height="18" rx="4" fill="#b58259" stroke="#285346" stroke-width="2"/><rect x="85" y="88" width="22" height="1