<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Finely chop garlic</title><desc id="desc">Peel; place on stable board. Cut slices then small pieces. Chop into fine, even pieces. Keep fingertips tucked back. Chopped garlic is different from whole cloves or garlic paste.</desc><g transform="translate(0,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#f3f6eb"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M81 105 Q55 78 95 48 Q139 75 120 107 Z" fill="#f1dfb1" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Peel; place on stable</tspan><tspan x="120" dy="19">board</tspan></text></g><g transform="translate(240,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#eef4ed"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><rect x="62" y="75" width="7" height="24" rx="2" fill="#f1dfb1" stroke="#285346" stroke-width="2"/><rect x="77" y="75" width="7" height="24" rx="2" fill="#f1dfb1" stroke="#285346" stroke-width="2"/><rect x="92" y="75" width="7" height="24" rx="2" fill="#f1dfb1" stroke="#285346" stroke-width="2"/><rect x="107" y="75" width="7" height="24" rx="2" fill="#f1dfb1" stroke="#285346" stroke-width="2"/><rect x="122" y="75" width="7" height="24" rx="2" fill="#f1dfb1" stroke="#285346" stroke-width="2"/><path d="M117 51 h52 v15 h-52 l-20