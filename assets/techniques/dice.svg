<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Dice an onion</title><desc id="desc">Halve, peel; flat side down. Cut strips; stop before root. Cut across into small cubes. Keep the root intact while cutting. Tuck fingertips away from the blade; discard the root at the end. No horizontal cut is needed.</desc><g transform="translate(0,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#f3f6eb"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><g transform="translate(8,25)"><rect x="20" y="40" width="182" height="91" rx="10" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M51 83 Q73 48 124 53 Q174 55 178 85 Q174 117 124 118 Q73 119 51 91 Z" fill="#ead7e6" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M49 87 l-10 -6 m10 6 l-12 0 m12 0 l-10 7" fill="none" stroke="#9e805c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M57 85 Q100 55 170 85 Q100 115 57 85" fill="none" stroke="#af8da5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M71 85 Q107 59 162 85 Q107 111 71 85" fill="none" stroke="#af8da5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M85 85 Q114 63 154 85 Q114 107 85 85" fill="none" stroke="#af8da5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M99 85 Q121 67 146 85 Q121 103 99 85" fill="none" stroke="#af8da5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Halve, peel; flat side</tspan><tspan x="120" dy="19">down</tspan></text></g><g transform="translate(240,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#eef4ed"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><rect x="20" y="40" width="182" height="91" rx="10" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M51 83 Q73 48 124 53 Q174 55 178 85 Q174 117 124 118 Q73 119 51 91 Z" fill="#ead7e6" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M49 87 l-10 -6 m10 6 l-12 0 m12 0 l-10 7" fill="none" stroke="#9e805c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M76 68 H174" fill="none" stroke="#285346" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M76 80 H174" fill="none" stroke="#285346" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M76 92 H174" fill="none" stroke="#285346" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M76 104 H174" fill="none" stroke="#285346" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M179 34 l-85 0" fill="none" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M101 28 l-7 6 l7 6" fill="none" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Cut strips; stop before</tspan><tspan x="120" dy="19">root</tspan></text></g><g transform="translate(480,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#fbf1e3"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><rect x="49" y="63" width="13" height="13" rx="2" fill="#ead7e6" stroke="#285346" stroke-width="2"/><rect x="73" y