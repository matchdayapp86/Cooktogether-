<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Fold a mixture gently</title><desc id="desc">Cut down through the middle. Sweep along base; lift over. Turn bowl; repeat gently. Use a large spoon or flexible spatula. Stop when dry streaks disappear; avoid vigorous beating.</desc><g transform="translate(0,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#f3f6eb"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><g transform="translate(8,25)"><path d="M37 73 H173 Q168 127 105 127 Q43 124 37 73 Z" fill="#e0e9e4" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M105 28 v69" fill="none" stroke="#b48b59" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Cut down through the</tspan><tspan x="120" dy="19">middle</tspan></text></g><g transform="translate(240,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#eef4ed"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><path d="M37 73 H173 Q168 127 105 127 Q43 124 37 73 Z" fill="#e0e9e4" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M71 87 Q97 117 144 83" fill="none" stroke="#b48b59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Sweep along base; lift</tspan><tspan x="120" dy="19">over</tspan></text></g><g transform="translate(480,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#fbf1e3"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text><g transform="translate(8,25)"><path d="M37 73 H173 Q168 127 105 127 Q43 124 37 73 Z" fill="#e0e9e4" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 53 Q105 30 143 54" fill="none" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Turn bowl; repeat gently</tspan></text></g></svg>
