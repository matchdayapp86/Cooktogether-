<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Slice spring onions</title><desc id="desc">Wash; trim roots and tired tops. Lay on board; slice across. Keep white and green as asked. Spring onions need trimming and washing, not the peeling method used for bulb onions.</desc><g transform="translate(0,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#f3f6eb"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M51 106 L143 46 M65 111 L157 51" fill="none" stroke="#739e79" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Wash; trim roots and</tspan><tspan x="120" dy="19">tired tops</tspan></text></g><g transform="translate(240,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#eef4ed"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M117 51 h52 v15 h-52 l-20 -7 Z" fill="#d9e2df" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="169" y="51" width="28" height="15" rx="3" fill="#285346" stroke="#285346" stroke-width="2"/><path d="M51 106 L143 46" fill="none" stroke="#739e79" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Lay on board; slice</tspan><tspan x="120" dy="19">across</tspan></text></g><g transform="translate(480,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#fbf1e3"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><circle cx="56" cy="84" r="10" fill="#bfd3a4" stroke="#285346" stroke-width="2"/><circle cx="56" cy="84" r="4" fill="#fffdf5" stroke="#285346" stroke-width="2"/><circle cx="78" cy="94" r="10" fill="#bfd3a4" stroke="#285346" stroke-width="2"/><circle cx="78" cy="94" r="4" fill="#fffdf5" stroke="#285346" stroke-width="2"/><circle cx="100" cy="84" r="10" fill="#bfd3a4" stroke="#285346" stroke-width="2"/><circle cx="100" cy="84" r="4" fill="#fffdf5" stroke="#285346" stroke-width="2"/><circle cx="122" cy="94" r="10" fill="#bfd3a4" stroke="#285346" stroke-width="2"/><circle cx="122" cy="94" r="4" fill="#fffdf5" stroke="#285346" stroke-width="2"/><circle cx="144" cy="84" r="10" fill="#bfd3a4" stroke="#285346" stroke-width="2"/><circle cx="144" cy="84" r="4" fill="#fffdf5" stroke="#285346" stroke-width="2"/><circle cx="166" cy="94" r="10" fill="#bfd3a4" stroke="#285346" stroke-width="2"/><circle cx="166" cy="94" r="4" fill="#fffdf5" stroke="#285346" stroke-width="2"/></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Keep white and green as</tspan><tspan x="120" dy="19">asked</tspan></text></g></svg>
