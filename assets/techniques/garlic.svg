<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Crush garlic with a press</title><desc id="desc">Separate and peel the cloves. Squeeze peeled cloves in press. Scrape paste off with a spoon. The illustration shows a garlic press. If you use a knife, finely chop on a stable board with fingers clear of the blade.</desc><g transform="translate(0,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#f3f6eb"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M81 105 Q55 78 95 48 Q139 75 120 107 Z" fill="#f1dfb1" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Separate and peel the</tspan><tspan x="120" dy="19">cloves</tspan></text></g><g transform="translate(240,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#eef4ed"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M75 66 h36 v22 H75 Z" fill="#d9e2df" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M79 66 L44 36 M107 65 L143 33" fill="none" stroke="#285346" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M80 91 v7 m9 -7 v9 m9 -9 v7" fill="none" stroke="#cfb680" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M131 102 Q113 77 137 65 Q159 86 147 105 Z" fill="#f1dfb1" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Squeeze peeled cloves in</tspan><tspan x="120" dy="19">press</tspan></text></g><g transform="translate(480,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#fbf1e3"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M75 66 h36 v22 H75 Z" fill="#d9e2df" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M79 66 L44 36 M107 65 L143 33" fill="none" stroke="#285346" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M80 91 v7 m9 -7 v9 m9 -9 v7" fill="none" stroke="#cfb680" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Scrape paste off with a</tspan><tspan x="120" dy="19">spoon</tspan></text></g></svg>
