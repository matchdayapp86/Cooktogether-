346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><rect x="31" y="70" width="143" height="47" rx="10" fill="#e0e9e4" stroke="#285346" stroke-width="2"/><path d="M174 82 h29" fill="none" stroke="#285346" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M39 97 Q78 81 107 96 T167 96" fill="none" stroke="#e5c988" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M139 29 L105 90" fill="none" stroke="#285346" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M105 66 Q70 88 91 103 Q111 114 124 76 M105 66 Q90 97 96 102 M105 66 Q111 96 96 102" fill="none" stroke="#285346" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Whisk until completely</tspan><tspan x="120" dy="19">smooth</tspan></text></g><g transform="translate(480,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#fbf1e3"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text><g transform="translate(8,25)"><rect x="31" y="70" width="143" height="47" rx="10" fill="#e0e9e4" stroke="#285346" stroke-width="2"/><path d="M174 82 h29" fill="none" stroke="#285346" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M39 97 Q78 81 107 96 T167 96" fill="none" stroke="#e5c988" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M139 29 L105 90" fill="none" stroke="#285346" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M105 66 Q70 88 91 103 Q111 114 124 76 M105 66 Q90 97 96 102 M105 66 Q111 96 96 102" fill="none" stroke="#285346" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="mid