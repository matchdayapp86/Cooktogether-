<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Cut potato chunks</title><desc id="desc">Wash; peel if asked. Make a flat base; cut steadily. Cut even recipe-sized chunks. This diagram is for chunks, not wedges, thin slices or whole baking potatoes. Follow the size in the recipe.</desc><g transform="translate(0,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#f3f6eb"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M57 96 C26 62 83 32 116 47 C175 46 184 110 128 110 Z" fill="#e5b666" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Wash; peel if asked</tspan></text></g><g transform="translate(240,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#eef4ed"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M57 96 C26 62 83 32 116 47 C175 46 184 110 128 110 Z" fill="#e5b666" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M117 51 h52 v15 h-52 l-20 -7 Z" fill="#d9e2df" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="169" y="51" width="28" height="15" rx="3" fill="#285346" stroke="#285346" stroke-width="2"/></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Make a flat base; cut</tspan><tspan x="120" dy="19">steadily</tspan></text></g><g transform="translate(480,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#fbf1e3"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M44 104 l-7 -27 l20 -12 l23 17 l-8 25 Z" fill="#e5b666" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M107 104 l-7 -27 l20 -12 l23 17 l-8 25 Z" fill="#e5b666" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M153 104 l-7 -27 l20 -12 l23 17 l-8 25 Z" fill="#e5b666" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Cut even recipe-sized</tspan><tspan x="120" dy="19">chunks</tspan></text></g></svg>
