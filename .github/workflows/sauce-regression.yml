name: Sauce and recipe regression checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Optional sauce data and JavaScript syntax
        run: node tests/optional-sauces.cjs
      - name: Core traybake and timer regression
        run: node tests/traybake-timers.cjs
      - name: Illustration placement regression
        run: node tests/illustrations.cjs && node tests/task-illustrations.cjs
