<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Boil potato pieces</title><desc id="desc">Cover raw pieces with cold water. Bring to boil; lower to simmer. Test a piece with a fork. For mash, the fork should slide into the centre easily. For parboiling, use the firmer texture in the task. Handle the test piece with a spoon.</desc><g transform="translate(0,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#f3f6eb"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><g transform="translate(8,25)"><rect x="31" y="70" width="143" height="47" rx="10" fill="#e0e9e4" stroke="#285346" stroke-width="2"/><path d="M174 82 h29" fill="none" stroke="#285346" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M37 83 h131" fill="none" stroke="#90bdca" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="47" y="91" width="22" height="18" rx="4" fill="#e5b666" stroke="#285346" stroke-width="2"/><rect x="85" y="88" width="22" height="18" rx="4" fill="#e5b666" stroke="#285346" stroke-width="2"/><rect x="126" y="85" width="22" height="18" rx="4" fill="#e5b666" stroke="#285346" stroke-width="2"/></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Cover raw pieces with</tspan><tspan x="120" dy="19">cold water</tspan></text></g><g transform="translate(240,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#eef4ed"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><rect x="31" y="70" width="143" height="47" rx="10" fill="#e0e9e4" stroke="#285346" stroke-width="2"/><path d="M174 82 h29" fill="none" stroke="#285346" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M37 83 h131" fill="none" stroke="#90bdca" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="48" cy="80" r="3" fill="#90bdca" stroke="#285346" stroke-width="2"/><circle cx="72" cy="71" r="3" fill="#90bdca" stroke="#285346" stroke-width="2"/><circle cx="96" cy="80" r="3" fill="#90bdca" stroke="#285346" stroke-width="2"/><circle cx="120" cy="71" r="3" fill="#90bdca" stroke="#285346" stroke-width="2"/><path d="M65 55 q-9 -9 0 -17 q8 -9 0 -16" fill="none" stroke="#8da999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M103 55 q-9 -9 0 -17 q8 -9 0 -16" fill="none" stroke="#8da999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M139 55 q-9 -9 0 -17 q8 -9 0 -16" fill="none" stroke="#8da999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Bring to boil; lower to</tspan><tspan x="120" dy="19">simmer</tspan></text></g><g transform="translate(480,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#fbf1e3"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M90 108 l-8 -29 l32 -9 l19 29 Z" fill="#e5b666" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 35 v50 m-9 -50 v20 h18 V35" fill="none" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Test a piece with a fork</tspan></text></g></svg>
