<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Deseed a pepper</title><desc id="desc">Cut open as the recipe says. Remove stalk, seeds and ribs. Keep required halves or sections. For stuffed peppers, keep the halves intact. Cut strips or cubes only if the recipe asks for them.</desc><g transform="translate(0,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#f3f6eb"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M78 52 Q52 42 47 68 L50 106 L98 106 L101 68 Q96 44 78 52 Z" fill="#cf7457" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M77 52 q-4 -18 12 -18" fill="none" stroke="#739e79" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 57 q39 -18 49 21 l-8 28 h-48 Z" fill="#f2b398" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="140" cy="73" r="3" fill="#fff4cc" stroke="#285346" stroke-width="2"/><circle cx="151" cy="82" r="3" fill="#fff4cc" stroke="#285346" stroke-width="2"/><circle cx="135" cy="93" r="3" fill="#fff4cc" stroke="#285346" stroke-width="2"/><circle cx="155" cy="66" r="3" fill="#fff4cc" stroke="#285346" stroke-width="2"/></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Cut open as the recipe</tspan><tspan x="120" dy="19">says</tspan></text></g><g transform="translate(240,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#eef4ed"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M78 52 Q52 42 47 68 L50 106 L98 106 L101 68 Q96 44 78 52 Z" fill="#cf7457" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M77 52 q-4 -18 12 -18" fill="none" stroke="#739e79" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 57 q39 -18 49 21 l-8 28 h-48 Z" fill="#f2b398" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="140" cy="73" r="3" fill="#fff4cc" stroke="#285346" stroke-width="2"/><circle cx="151" cy="82" r="3" fill="#fff4cc" stroke="#285346" stroke-width="2"/><circle cx="135" cy="93" r="3" fill="#fff4cc" stroke="#285346" stroke-width="2"/><circle cx="155" cy="66" r="3" fill="#fff4cc" stroke="#285346" stroke-width="2"/><path d="M164 49 l0 30" fill="none" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M158 72 l6 7 l6 -7" fill="none" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Remove stalk, seeds and</tspan><tspan x="120" dy="19">ribs</tspan></text></g><g transform="translate(480,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#fbf1e3"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text><g transform="translate(8,25)"><rect x="21" y="111" width="178" height="13" rx="5" fill="#e6cfaa" stroke="#285346" stroke-width="2"/><path d="M56 105 Q40 62 68 56 Q87 53 94 75 L93 105 Z" fill="#f2b398" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 105 Q110 64 137 56 Q163 53 173 78 L165 105 Z" fill="#f2b398" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin