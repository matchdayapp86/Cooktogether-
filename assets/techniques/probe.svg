<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Check the centre temperature</title><desc id="desc">Probe thickest part or centre. Avoid bone and the hot pan. Hold target for required time. For food needing thorough cooking, one FSA combination is 75°C for 30 seconds, or 70°C for 2 minutes. Cook longer if below target; clean the probe before rechecking.</desc><g transform="translate(0,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#f3f6eb"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text><g transform="translate(8,25)"><path d="M44 113 q-17 -58 52 -51 q57 -24 72 43 Z" fill="#b58259" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M133 42 l-33 46" fill="none" stroke="#285346" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="124" y="20" width="49" height="27" rx="5" fill="#dbe9dc" stroke="#285346" stroke-width="2"/><text x="148" y="39" text-anchor="middle" fill="#285346" font-size="12">°C</text></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Probe thickest part or</tspan><tspan x="120" dy="19">centre</tspan></text></g><g transform="translate(240,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#eef4ed"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text><g transform="translate(8,25)"><path d="M44 113 q-17 -58 52 -51 q57 -24 72 43 Z" fill="#b58259" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M133 42 l-33 46" fill="none" stroke="#285346" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="124" y="20" width="49" height="27" rx="5" fill="#dbe9dc" stroke="#285346" stroke-width="2"/><text x="148" y="39" text-anchor="middle" fill="#285346" font-size="12">°C</text></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Avoid bone and the hot</tspan><tspan x="120" dy="19">pan</tspan></text></g><g transform="translate(480,0)"><rect x="5" y="8" width="230" height="224" rx="18" fill="#fbf1e3"/><circle cx="25" cy="29" r="12" fill="#285346"/><text x="25" y="34" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text><g transform="translate(8,25)"><path d="M44 113 q-17 -58 52 -51 q57 -24 72 43 Z" fill="#b58259" stroke="#285346" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M133 42 l-33 46" fill="none" stroke="#285346" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="124" y="20" width="49" height="27" rx="5" fill="#dbe9dc" stroke="#285346" stroke-width="2"/><text x="148" y="39" text-anchor="middle" fill="#285346" font-size="12">75°C</text></g><text x="120" y="185" text-anchor="middle" fill="#285346" font-family="system-ui,sans-serif" font-size="15" font-weight="600"><tspan x="120" dy="0">Hold target for required</tspan><tspan x="120" dy="19">time</tspan></text></g></svg>
